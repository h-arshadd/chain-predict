coins:
  BTC:
    subreddits:
      - Bitcoin
      - BitcoinMarkets
      - CryptoCurrency
    search_query: "BTC OR Bitcoin"
  
  ETH:
    subreddits:
      - ethereum
      - ethtrader
      - CryptoCurrency
    search_query: "ETH OR Ethereum"

reddit:
  post_limit: null  # null = fetch as many as Reddit's API allows (max ~1000 per query)
  user_agent: "sentiment-pipeline/0.1"

model:
  sentiment_model: "ElKulako/cryptobert"
  max_tokens: 512